# 应用名称
spring.application.name=ElasticSearchLearn

# 服务端口
server.port=8080

# Elasticsearch 配置 (Spring Boot 2.7.x 格式)
spring.elasticsearch.rest.uris=http://8.140.198.122:9200
spring.elasticsearch.rest.connection-timeout=30s
spring.elasticsearch.rest.read-timeout=60s
# 添加重试配置
spring.elasticsearch.rest.connection-request-timeout=30s

# 日志配置
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.org.elasticsearch=DEBUG

# JSON 配置
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8
